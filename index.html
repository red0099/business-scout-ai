<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Business Scout AI – كشّاف الأعمال الذكي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background-color: #F8FAFC; color: #0A2647; line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
        body.lang-en { font-family: 'Inter', sans-serif; direction: ltr; text-align: left; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; width: 100%; }
        .navbar { background-color: #0A2647; padding: 18px 0; box-shadow: 0 4px 20px rgba(10,38,71,0.15); position: sticky; top: 0; z-index: 100; }
        .navbar .container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }

        .logo-icon { background: #4CC9F0; color: #0A2647; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight:800 }
        .logo span { color: #4CC9F0; }
        .lang-switcher { display: flex; gap: 6px; background: rgba(255,255,255,0.08); padding: 4px; border-radius: 50px; }
        .lang-btn { background: transparent; border: none; color: rgba(255,255,255,0.6); padding: 8px 18px; border-radius: 30px; font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 0.85rem; }
        .lang-btn:hover { color: #FFFFFF; background: rgba(76,201,240,0.15); }

        .hero h1 { font-size: clamp(2.2rem,5vw,3.8rem); font-weight: 800; line-height: 1.2; margin-bottom: 16px; color: #0A2647; }
        .hero h1 .highlight { background: linear-gradient(135deg,#4CC9F0,#144272); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .hero p { font-size: 1.2rem; color: #334155; max-width: 650px; margin: 0 auto 40px; opacity: 0.85; }
        .form-card { background: #FFFFFF; border-radius: 32px; padding: 40px 36px; box-shadow: 0 20px 60px rgba(10,38,71,0.08); border: 1px solid rgba(20,66,114,0.06); max-width: 820px; margin: 0 auto 30px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #4CC9F0; background: #FFFFFF; box-shadow: 0 0 0 4px rgba(76,201,240,0.15); }
        .form-group textarea { resize: vertical; min-height: 100px; }
        .btn-scan { background: #0A2647; color: #FFFFFF; border: none; padding: 18px 40px; border-radius: 60px; font-weight: 700; font-size: 1.2rem; font-family: 'Cairo', sans-serif; cursor: pointer; }
        .btn-scan:hover { background: #144272; transform: translateY(-2px); box-shadow: 0 12px 30px rgba(10,38,71,0.3); }
        .btn-scan:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }
        .btn-scan .icon { font-size: 1.5rem; }
        .result-box { max-width: 820px; margin: 0 auto 40px; background: #FFFFFF; border-radius: 24px; padding: 30px; border: 1px solid #E9EDF4; box-shadow: 0 10px 30px rgba(0,0,0,0.05); display: none; }
        .result-box.visible { display: block; }
        .result-box h3 { color: #0A2647; font-size: 1.3rem; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
        .result-box h3 span { background: #4CC9F0; color: #0A2647; padding: 0 12px; border-radius: 20px; font-size: 0.8rem; }
        .result-content { background: #F8FAFC; padding: 20px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; color: #1E293B; line-height: 1.8; max-height: 600px; overflow-y: auto; }
        .footer { margin-top: auto; text-align: center; padding: 30px 0; border-top: 1px solid rgba(10,38,71,0.06); color: #94A3B8; font-size: 0.9rem; }
        @media (max-width:768px) { .navbar .container { flex-direction: column; align-items: stretch; gap: 12px; } .logo { justify-content: center; font-size: 1.3rem; } .lang-switcher { justify-content: center; } .form-grid { grid-template-columns: 1fr; } }
        .loading-dots::after { content: ''; animation: dots 1.5s steps(4, end) infinite; }
        @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } 100% { content: ''; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="#" class="logo"><div class="logo-icon">S</div>Business <span>Scout</span> AI</a>
            <div class="lang-switcher" id="langSwitcher">
                <button class="lang-btn active" data-lang="ar" data-dir="rtl">🇲🇦 الدارجة</button>
                <button class="lang-btn" data-lang="ar-fu" data-dir="rtl">📖 الفصحى</button>
                <button class="lang-btn" data-lang="en" data-dir="ltr">🇬🇧 English</button>
            </div>
        </div>
    </nav>
    <main>
        <div class="container">
            <section class="hero">
                <div class="hero-badge" id="badgeText">🚀 كشّاف الأعمال الذكي للمغرب</div>
                <h1 id="heroTitle">خطّط لمشروعك<br /><span class="highlight">بذكاء وكشّاف</span> واحد</h1>
                <p id="heroDesc">أدخل فكرة مشروعك، ودع فريق الخبراء الاستشاريين يعد لك دراسة جدوى احترافية بالأرقام.</p>
            </section>
            <section class="form-card">
                <form id="projectForm" onsubmit="return handleScan(event)">
                    <div class="form-grid">
                        <div class="form-group"><label for="projectName">اسم المشروع <span class="required">*</span></label><input type="text" id="projectName" placeholder="مثلاً: مشروع مقهى صغير" /></div>
                        <div class="form-group"><label for="sector">القطاع</label><select id="sector"><option value="تكنولوجيا">تكنولوجيا</option><option value="الفلاحة">الفلاحة</option><option value="التجارة">التجارة</option><option value="الخدمات">الخدمات</option></select></div>
                        <div class="form-group"><label for="budget">الميزانية التقريبية (درهم)</label><input type="number" id="budget" placeholder="مثلاً: 500000" /></div>
                        <div class="form-group"><label for="location">الجهة / المدينة</label><input type="text" id="location" placeholder="الدار البيضاء، مراكش، ..." /></div>
                        <div class="form-group full-width"><label for="description">ملخص الفكرة</label><textarea id="description" placeholder="اشرح فكرة مشروعك بإيجاز"></textarea></div>
                    </div>
                    <button type="submit" class="btn-scan" id="scanBtn"><span class="icon">🔍</span><span id="scanBtnText">اسكَن السوق الآن</span></button>
                </form>
            </section>
            <div class="result-box" id="resultBox"><h3>📊 تقرير دراسة الجدوى الاستشارية <span>AI</span></h3><div class="result-content" id="resultContent">سيظهر هنا تقريرك بعد تحليل السوق.</div></div>
        </div>
    </main>
    <footer class="footer"><div class="container"><p id="footerText">© 2026 Business Scout AI — نبني مستقبل الاستثمار في المغرب.</p></div></footer>
    <script>
-        let API_KEY = localStorage.getItem('groq_api_key');
-        if (!API_KEY) {
-            API_KEY = prompt('🔑 أدخل مفتاح Groq API الخاص بك (سيُحفظ محلياً في متصفحك):');
-            if (API_KEY) localStorage.setItem('groq_api_key', API_KEY);
-            else alert('⚠️ لا يمكن استخدام التطبيق بدون مفتاح API.');
-        }
+        // Security: API key is handled server-side. Do not collect or store it in the browser.
         const langBtns = document.querySelectorAll('.lang-btn');
         const body = document.body;
         const translations = {
             'ar': { badge: '🚀 كشّاف الأعمال الذكي للمغرب', title: 'خطّط لمشروعك<br /><span class="highlight">بذكاء وكشّاف</span> واحد', desc: 'أدخل فكرة مشروعك، ودع فريق الخبراء الاستشاريين يعد لك دراسة جدوى احترافية بالأرقام.', scan: 'اسكَن السوق الآن', footer: '© 2026 Business Scout AI — نبني مستقبل الاستثمار في المغرب.', placeholder_name: 'مثلاً: مشروع مقهى صغير', placeholder_budget: 'مثلاً: 500000', placeholder_location: 'الدار البيضاء، مراكش، ...', placeholder_desc: 'اشرح فكرة مشروعك بإيجاز' },
             'ar-fu': { badge: '🚀 الكشاف الذكي للأعمال في المغرب', title: 'خطّط لمشروعك<br /><span class="highlight">بذكاء وكشاف</span> واحد', desc: 'أدخل فكرة مشروعك، ودع فريق الخبراء الاستشاريين يعد لك دراسة جدوى احترافية بالأرقام.', scan: 'ابدأ التحليل', footer: '© 2026 Business Scout AI — نبني مستقبل الاستثمار في المغرب.', placeholder_name: 'مثلاً: مشروع محل تجاري', placeholder_budget: 'مثلاً: 300000', placeholder_location: 'الرباط، أكادير، ...', placeholder_desc: 'أعطِ وصفاً مختصراً لفكرتك' },
             'en': { badge: '🚀 Smart Business Scout for Morocco', title: 'Plan your project<br />with <span class="highlight">one smart Scout</span>', desc: 'Enter your project idea, and let our expert consultants prepare a professional feasibility study with numbers.', scan: 'Run Scan', footer: '© 2026 Business Scout AI — Building the future of investment in Morocco.', placeholder_name: 'e.g. small cafe project', placeholder_budget: 'e.g. 500000', placeholder_location: 'Casablanca, Marrakech, ...', placeholder_desc: 'Briefly describe your project idea' }
         };
         function setLanguage(lang, dir) {
             body.dir = dir; body.lang = lang.startsWith('ar') ? 'ar' : 'en'; body.className = lang.startsWith('ar') ? '' : 'lang-en';
             langBtns.forEach(btn => { btn.classList.remove('active'); if (btn.dataset.lang === lang) btn.classList.add('active'); });
             const t = translations[lang]; if (!t) return;
             document.getElementById('badgeText').innerHTML = t.badge;
             document.getElementById('heroTitle').innerHTML = t.title;
             document.getElementById('heroDesc').textContent = t.desc;
             document.getElementById('scanBtnText').textContent = t.scan;
             document.getElementById('footerText').textContent = t.footer;
             document.getElementById('projectName').placeholder = t.placeholder_name;
             document.getElementById('budget').placeholder = t.placeholder_budget;
             document.getElementById('location').placeholder = t.placeholder_location;
             document.getElementById('description').placeholder = t.placeholder_desc;
         }
         langBtns.forEach(btn => { btn.addEventListener('click', function() { setLanguage(this.dataset.lang, this.dataset.dir); }); });
         document.addEventListener('DOMContentLoaded', () => { const defaultBtn = document.querySelector('.lang-btn[data-lang="ar"]'); if (defaultBtn) setLanguage('ar', 'rtl'); });

         async function handleScan(event) {
             event.preventDefault();
-            if (!API_KEY) { alert('❌ لا يوجد مفتاح API. يرجى تحديث الصفحة وإدخال المفتاح.'); return false; }
-
-            const name = document.getElementById('projectName').value.trim();
+            const name = document.getElementById('projectName').value.trim();
             if (!name) { alert('⚠️ من فضلك، أدخل اسم المشروع قبل المسح!'); return false; }

             const btn = document.getElementById('scanBtn');
             const btnText = document.getElementById('scanBtnText');
             const icon = btn.querySelector('.icon');
             const originalText = btnText.textContent;

             // Loading state
             btn.disabled = true;
             btnText.textContent = '🔄 جاري إعداد التقرير...';
             icon.textContent = '⏳';
             btn.style.opacity = '0.8';

             const sector = document.getElementById('sector').value;
             const budget = document.getElementById('budget').value || 'غير محدد';
             const location = document.getElementById('location').value || 'غير محدد';
             const description = document.getElementById('description').value || 'لا يوجد وصف تفصيلي';

             try {
                 const response = await fetch('/.netlify/functions/scan', {
                     method: 'POST',
                     headers: { 'Content-Type': 'application/json' },
-                    body: JSON.stringify({ apiKey: API_KEY, name, sector, budget, location, description })
+                    body: JSON.stringify({ name, sector, budget, location, description })
                 });

                 const text = await response.text();
                 let data;
                 try { data = JSON.parse(text); } catch (e) { throw new Error('استجابة غير صالحة من الخادم'); }

                 if (!response.ok) {
                     const serverMessage = data?.error || data?.message || 'خطأ غير متوقع من الخادم';
                     throw new Error(serverMessage);
                 }

                 const resultBox = document.getElementById('resultBox');
                 const resultContent = document.getElementById('resultContent');

                 const markdownReport = data.report || (Array.isArray(data.sections) ? data.sections.map(s => `## ${s.name}\n\n${s.content || ''}`).join('\n\n') : '');
                 resultContent.textContent = markdownReport || 'لا توجد مخرجات متاحة.';

                 if (Array.isArray(data.errors) && data.errors.length > 0) {
                     console.warn('Agent errors:', data.errors);
                     alert('⚠️ بعض الوكلاء لم ينجحوا بالكامل — تحقق من وحدة التحكم للاطلاع على التفاصيل.');
                 }

                 resultBox.classList.add('visible');
                 resultBox.scrollIntoView({ behavior: 'smooth', block: 'start' });

             } catch (error) {
                 console.error('خطأ أثناء اتصال المسح:', error);
                 alert(`❌ حدث خطأ أثناء التحليل: ${error.message || 'خطأ غير معروف'}`);
             } finally {
                 btn.disabled = false;
                 btnText.textContent = originalText;
                 icon.textContent = '🔍';
                 btn.style.opacity = '1';
             }
             return false;
         }
     </script>
</body>
</html>
